cat > templates/dashboard.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AceTrader</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
  body { background: #0d1117; color: #e6edf3; padding: 16px; min-height: 100vh; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 16px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 14px; }
  .k { color: #8b949e; }
  .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .green { color: #3fb950; } .red { color: #f85149; } .yellow { color: #d29922; }
  .btn { display: block; padding: 12px 18px; border-radius: 6px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 8px; }
  .start { background: #238636; color: #fff; }
  .stop { background: #da3633; color: #fff; }
  .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .live { background: #3fb950; animation: p 1.4s infinite; }
  .dead { background: #8b949e; }
  @keyframes p { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 4px; text-align: left; border-bottom: 1px solid #30363d; }
  th { color: #8b949e; font-weight: 500; font-size: 12px; }
</style>
</head>
<body>

<h1>AceTrader</h1>
<div class="sub" id="status"><span class="pulse dead"></span> connecting…</div>

<div class="card">
  <div class="row"><span class="k">Signal</span><span class="v" id="sig">—</span></div>
  <div class="row"><span class="k">Price</span><span class="v" id="price">—</span></div>
  <div class="row"><span class="k">Last update</span><span class="v" id="ts">—</span></div>
</div>

<div class="card">
  <div class="row"><span class="k">Total P&L</span><span class="v" id="pnl">$0.00</span></div>
  <div class="row"><span class="k">Today</span><span class="v" id="today">$0.00</span></div>
  <div class="row"><span class="k">Trades today</span><span class="v" id="tt">0</span></div>
  <div class="row"><span class="k">Mode</span><span class="v" id="mode">—</span></div>
</div>

<div class="card">
  <button class="btn start" onclick="ctl('start')">Start trading</button>
  <button class="btn stop" onclick="ctl('stop')">Stop trading</button>
</div>

<div class="card">
  <table id="recent"><tr><th>Time</th><th>Dir</th><th>P&L</th></tr></table>
</div>

<script>
const fmt$ = n => (n >= 0 ? '+$' : '-$') + Math.abs(n).toFixed(2);
const cls$ = n => n > 0 ? 'green' : n < 0 ? 'red' : '';

async function tick() {
  try {
    const r = await fetch('/api/state');
    const d = await r.json();
    document.getElementById('status').innerHTML =
      '<span class="pulse ' + (d.running ? 'live' : 'dead') + '"></span>' +
      (d.running ? 'running' : 'stopped') +
      (d.halted ? ' · <span class="red">HALTED: ' + (d.halt_reason || '') + '</span>' : '');
    document.getElementById('sig').textContent = d.last_signal || '—';
    document.getElementById('sig').className = 'v ' +
      (d.last_signal === 'CALL' ? 'green' : d.last_signal === 'PUT' ? 'red' : '');
    document.getElementById('price').textContent = d.last_price ?? '—';
    document.getElementById('ts').textContent = d.last_time ? d.last_time.slice(11, 19) + ' UTC' : '—';
    const pnl = d.total_pnl || 0, today = d.today_pnl || 0;
    document.getElementById('pnl').textContent = fmt$(pnl);
    document.getElementById('pnl').className = 'v ' + cls$(pnl);
    document.getElementById('today').textContent = fmt$(today);
    document.getElementById('today').className = 'v ' + cls$(today);
    document.getElementById('tt').textContent = d.trades_today || 0;
    document.getElementById('mode').textContent = d.paper_mode ? 'PAPER' : 'LIVE';
    document.getElementById('mode').className = 'v ' + (d.paper_mode ? 'yellow' : 'red');
    const rows = (d.recent || []).slice(0, 10).map(t =>
      '<tr><td>' + (t.time || '').slice(11, 19) + '</td>' +
      '<td class="' + (t.direction === 'CALL' ? 'green' : 'red') + '">' + t.direction + '</td>' +
      '<td class="' + cls$(t.pnl) + '">' + fmt$(t.pnl) + '</td></tr>'
    ).join('');
    document.getElementById('recent').innerHTML = '<tr><th>Time</th><th>Dir</th><th>P&L</th></tr>' + rows;
  } catch (e) {
    document.getElementById('status').innerHTML = '<span class="pulse dead"></span> offline';
  }
}

async function ctl(a) {
  await fetch('/api/' + a, { method: 'POST' });
  setTimeout(tick, 800);
}

setInterval(tick, 3000);
tick();
</script>
</body>
</html>
EOF
